name: Verify Still
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: still-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run verify:types
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run verify:packed -- --export "$RUNNER_TEMP/still-starter-delivery"
      - run: npm run verify:contract
      - run: npm run verify:upgrade
      - name: Record qualified delivery identity
        run: node scripts/ci-qualification.mjs "$RUNNER_TEMP/still-starter-delivery"
      - name: Retain qualified neutral starter delivery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: still-starter-delivery-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/still-starter-delivery
          if-no-files-found: error
          retention-days: 30
          # The allowlisted export's only hidden file is its generated .gitignore.
          include-hidden-files: true
